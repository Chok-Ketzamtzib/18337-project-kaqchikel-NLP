cover_at = 24.0
instagram = """
Every trigram is a point in a cube: its three characters are its coordinates.

Plot the 250 most common trigrams from each corpus and the apostrophe trigrams sit apart: ’ for the Chronicle, ' for Tang/Bennett.

Fold ’ into ' and they land in the same place.
"""
linkedin = """
What does a character trigram look like? Here, a point in a cube.

Each axis runs through the same characters in Unicode order, so a trigram's three characters are its coordinates. Plotting the 250 most common trigrams from each Kaqchikel corpus, the letter-only trigrams overlap, but the apostrophe trigrams sit apart: the Chronicle's use ’ (U+2019), Tang/Bennett's use ' (U+0027).

Folding ’ into ' puts the apostrophe trigrams of both corpora in the same place. The Chronicle-only trigrams that remain are punctuation and digits, which Tang/Bennett never uses. Keep only characters both corpora share and trigrams trail the plain word model.
"""

[[post]]
slug = "decision_boundary"
scene = "DecisionBoundary"
title = "Naive Bayes draws one flat cut"
cover_at = 17.0
instagram = """
Naive Bayes draws one flat cut.

Its score is a sum of one weight per trigram. Split that sum three ways (apostrophe trigrams, letters only, punctuation and digits) and every sentence is a point in 3D, with a plane as the boundary.

Turn the plane edge-on and watch the sentences cross it as the spelling cues go away.
"""
linkedin = """
Multinomial Naive Bayes is a linear classifier, and you can see it.

The score for a sentence is offset + x·w: one weight per trigram, added up. Splitting that sum into three parts (trigrams with an apostrophe, letters only, punctuation and digits) puts every test sentence at a point in 3D, and the decision boundary, score = 0, is a flat plane.

Turned edge-on, the plane becomes a cut on a number line. Replaying the orthography ablation on those histograms: raw text 98.9%, apostrophes folded 94.4%, shared characters only 92.7%, with more sentences crossing the cut each time.
"""

