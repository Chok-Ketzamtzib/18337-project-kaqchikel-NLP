[[post]]
slug = "intro"
title = "Teaching a computer to read Kaqchikel"
still = { slug = "trigram_window", scene = "TrigramWindow", at = 8.0 }
instagram = """
In 2023 my Kaqchikel Maya NLP project stalled on one problem: nobody had labeled the data.

So I changed the question. Not “is this sentence happy or sad?” but “which of two sources is it from?”: the Kaqchikel Chronicle, written by Kaqchikel scribes in the 1500s and 1600s, or a modern written corpus compiled by Kevin Tang and Ryan Bennett.

My classifier scored 98.9%. Most of that was one character. This series shows which.
"""
linkedin = """
In 2023 I started a class project to build sentiment analysis for Kaqchikel Maya. It stalled on one problem: nobody had labeled the data.

Kaqchikel is spoken by several hundred thousand people in the highlands of Guatemala. For NLP it counts as “low-resource”: not short on speakers, but short on text a computer can learn from.

When I came back to the project this year, the sentiment column in my spreadsheet said “String” on almost every row. A placeholder, not a label. So I changed the question. Instead of asking whether a sentence is happy or sad, I asked which of two sources it came from:
• the Kaqchikel Chronicle (Kiwujil Xajila’), written by Kaqchikel scribes in the 1500s and 1600s
• a modern written corpus compiled by the linguists Kevin Tang and Ryan Bennett

The labels came free. I built the classifier from scratch in Julia for MIT 18.337, with TF-IDF features and Naive Bayes, and it scored 98.9% on held-out text.

Most of that turned out to be one character. Over the next five weeks I'll show how I found out, with an animation for each step.

If you work with low-resource languages, I'd like to hear what has tripped you up.
"""

[[post]]
slug = "trigram_window"
scene = "TrigramWindow"
title = "How a model reads Kaqchikel"
cover_at = 30.0
instagram = """
How does a classifier read Kaqchikel Maya? Three characters at a time.

Slide a 3-character window along a line from the Kaqchikel Chronicle, “K’a ri’ xek’ule’”, and you get 16 trigrams. 11 of them contain ’, and those 11 carry nearly all the weight.

Of the 50 trigrams that most signal the Chronicle, 45 contain ’.
"""
linkedin = """
How does a text classifier read Kaqchikel Maya? Three characters at a time.

My classifier's features are character trigrams. Sliding a three-character window along one line of the Kaqchikel Chronicle, “K’a ri’ xek’ule’”, gives 16 of them. The 11 that contain ’ each weigh 6 to 9 toward the Chronicle; the other 5 stay under 2.

Across the whole vocabulary, 45 of the 50 strongest Chronicle trigrams contain ’, and 40 of the 50 strongest Tang/Bennett trigrams contain '.

In Kaqchikel the apostrophe is a letter: it marks the glottal stop and ejective consonants like k’ and q’. So at first this looked like the model had picked up something real about the language. The next posts show what it had actually learned.
"""

[[post]]
slug = "confusion_morph"
scene = "ConfusionMorph"
title = "98.9% accurate. Too good?"
cover_at = 21.0
instagram = """
98.9% accurate. Too good to be true?

Every dot is one of 1,606 test sentences. The word model gets 91 wrong; character trigrams only 17.

Then write the glottal stop the same way in both corpora (’ becomes '): 90 wrong. Keep only characters both corpora use: 118 wrong, now worse than words.
"""
linkedin = """
My Kaqchikel classifier scored 98.9% on held-out text. That should have been a warning, not a result.

I wrote it up as a win: character trigrams catch Kaqchikel word-building that whole words miss. That story was wrong.

In this animation each of the 1,606 test sentences is a dot in its confusion-matrix cell:
• word unigrams: 94.3%, 91 wrong
• character trigrams: 98.9%, 17 wrong
• trigrams with ’ and ' folded into one character: 94.4%, 90 wrong (McNemar vs words: p = 1.0)
• trigrams on characters both corpora share: 92.7%, 118 wrong (p = 0.009, now below words)

Most of the trigram model's edge came from a single character. The next post shows which one.
"""

[[post]]
slug = "confound_reveal"
scene = "ConfoundReveal"
title = "Two apostrophes, one sound"
cover_at = 8.0
instagram = """
Two apostrophes, one sound.

Kaqchikel writes its glottal stop with an apostrophe. The Chronicle types ’ (U+2019) 15,982 times. Tang/Bennett types ' (U+0027) 269,074 times and ’ never: its authors removed punctuation and normalized apostrophes on purpose when cleaning their sources.

A one-line rule with no training (“has a character Tang/Bennett never uses? say Chronicle”) scores 98.2%.
"""
linkedin = """
Two apostrophes, one sound, and a data leak.

Both Kaqchikel corpora write the glottal stop with an apostrophe, but not the same character:
• the Chronicle: ’ (U+2019) 15,982 times, ' (U+0027) 171 times
• Tang/Bennett: ' 269,074 times, ’ zero times, and no commas, digits, or other punctuation

That second line is by design. Tang and Bennett removed punctuation and normalized apostrophes while cleaning their corpus, because their sources (some from scanned book pages) had irregular punctuation and many different apostrophe characters. The Chronicle text never went through the same step.

22 characters appear in the Chronicle's training text and never in Tang/Bennett's. A rule with no training, “if a sentence has one of them, say Chronicle”, gets 98.2% of the test set right. That beats the word model (94.3%, McNemar p ≈ 9e-9) and nearly matches the trigram model (98.9%).

My labels came from which corpus each sentence was in, so the difference in cleaning leaked the label. The fix: run the dumbest possible baseline before trusting a model, and normalize every source the same way.

What's the simplest baseline that has embarrassed one of your models?
"""

[[post]]
slug = "starfield_zoom"
scene = "StarfieldZoom"
title = "387,213 points of light"
cover_at = 22.0
instagram = """
387,213 points of light: the whole training matrix, one per nonzero entry.

6,420 sentences by 7,784 trigrams, 99.2% empty. Group the rows by corpus and the columns by apostrophe, and the spelling split is right there: Tang/Bennett rows have 0 points in the ’ columns.
"""
linkedin = """
You could see the leak before training a model. This is the entire training matrix of my Kaqchikel classifier, one point of light per nonzero entry.

It has 6,420 sentences by 7,784 character trigrams (the vocabulary of the full dataset) and is 99.2% empty. Each pixel sums a 4×4 block of cells.

Grouping the rows by corpus and the columns by which apostrophe a trigram contains makes the confound visible without any model:
• the 510 ’ columns: 33,656 points in Chronicle rows, 0 in Tang/Bennett rows
• the 588 ' columns: 374 points in Chronicle rows, 46,028 in Tang/Bennett rows

The spelling split is written into the data before training starts. Look at the features before you look at the accuracy.
"""

[[post]]
slug = "tug_of_war"
scene = "TugOfWar"
title = "Every word pulls"
cover_at = 16.0
instagram = """
Every word pulls.

The word model adds one weight per word: right for the Chronicle, left for Tang/Bennett. It deletes punctuation first, ’ included, so q’atb’äl is counted as qatbäl.

A close call: “Xa majani xeb’i’in ruch’ab’äl dios chi qe” ends at −0.70, the wrong side. The trigram model, which still sees the ’, scores it +340.
"""
linkedin = """
The model that looked honest was honest by accident.

My word-unigram model adds one weight per word. Its tokenizer strips punctuation first, apostrophes included, so q’atb’äl is counted as qatbäl. That is why it never fell for the apostrophe leak.

Two Chronicle sentences from the test set, scored one word at a time:
• one lands at +1.85 after words pull both ways: correct
• “Xa majani xeb’i’in ruch’ab’äl dios chi qe” leads toward the Chronicle until ruch’ab’äl, dios, and qe pull it to −0.70: wrong

The character-trigram model scores that second sentence +340. Words can be a close call; the spelling almost never is.

The catch: in Kaqchikel the apostrophe is a letter, marking the glottal stop and ejectives like k’ and q’. The word model avoided the leak by deleting part of the alphabet. The better fix is to write the apostrophe one way in every source, not to throw it away.
"""

[[post]]
slug = "decision_boundary"
scene = "DecisionBoundary"
title = "Naive Bayes draws one flat cut"
cover_at = 17.0
instagram = """
Naive Bayes draws one flat cut.

Its score is a sum of one weight per trigram. Split that sum three ways (apostrophe trigrams, letters only, punctuation and digits) and every sentence is a point in 3D, with a plane as the boundary.

Turn the plane edge-on and watch the sentences cross it as the spelling cues go away.
"""
linkedin = """
Multinomial Naive Bayes is a linear classifier, and you can see it.

The score for a sentence is offset + x·w: one weight per trigram, added up. Splitting that sum into three parts (trigrams with an apostrophe, letters only, punctuation and digits) puts every test sentence at a point in 3D, and the decision boundary, score = 0, is a flat plane.

Turned edge-on, the plane becomes a cut on a number line. Replaying the orthography ablation on those histograms: raw text 98.9%, apostrophes folded 94.4%, shared characters only 92.7%, with more sentences crossing the cut each time.

This is one reason I like Naive Bayes for a first model on a new language: every weight can be read off and questioned.
"""

[[post]]
slug = "sparse_transpose"
scene = "SparseTranspose"
title = "Why training copies its matrix"
cover_at = 30.0
instagram = """
sparse(transpose(X)): why Naive Bayes training copies its feature matrix first.

Julia stores sparse matrices column by column. Training walks one sentence (row) at a time, which would mean searching every column. Transposing once makes each sentence one contiguous slice.
"""
linkedin = """
Why does my Naive Bayes trainer start with sparse(transpose(X))?

Julia's SparseMatrixCSC stores nonzeros column by column. The feature matrix has one row per sentence, and training visits one sentence at a time, so reading a row from CSC storage means searching every column.

Building the transpose once flips that: each sentence becomes one contiguous slice of the storage arrays. The copy costs time and memory, and, as the next post shows, it is most of the training time.
"""

[[post]]
slug = "thread_scaling"
scene = "ThreadScaling"
title = "Why 8 threads are not 8× faster"
cover_at = 20.0
instagram = """
Why 8 threads are not 8× faster.

Counting trigrams splits across threads; building the sparse matrix does not. That one-thread step caps feature extraction at about 2.1×, and 8 threads measured 1.67×.

Naive Bayes training is 81% sparse(transpose(X)) on one thread, so 8 threads measured 0.95×.
"""
linkedin = """
Why 8 threads are not 8× faster, and a speedup I had to take back.

The first version of this project reported that Naive Bayes training ran about 3.2× faster on 8 threads. It didn't. I had timed each version once with @elapsed, and in Julia the first call to a function includes compiling it. I was timing the compiler.

With a warmup call and 30 BenchmarkTools samples per setting, what's left is Amdahl's law:
• Feature extraction splits across threads (counting trigrams per sentence) except for one step (building the sparse matrix). That serial step caps it at about 2.1× even with unlimited threads. Measured: 1.67× on 8 threads.
• Naive Bayes training is 81% sparse(transpose(X)), which runs on one thread. Measured: 0.95× on 8 threads, within noise of one thread.

More threads only speed up the part that splits. And in Julia, never time the first call.
"""

