Every word pulls.

The word model adds one weight per word: right for the Chronicle, left for Tang/Bennett. It deletes punctuation first, ’ included, so q’atb’äl is counted as qatbäl.

A close call: “Xa majani xeb’i’in ruch’ab’äl dios chi qe” ends at −0.70, the wrong side. The trigram model, which still sees the ’, scores it +340.
