title = "How a model reads Kaqchikel"
cover_at = 30.0
instagram = """
How does a classifier read Kaqchikel Maya? Three characters at a time.

Slide a 3-character window along a line from the Kaqchikel Chronicle, “K’a ri’ xek’ule’”, and you get 16 trigrams. 11 of them contain ’, and those 11 carry nearly all the weight.

Of the 50 trigrams that most signal the Chronicle, 45 contain ’.
"""
linkedin = """
How does a text classifier read Kaqchikel Maya? Three characters at a time.

For an MIT 18.337 project I built a Naive Bayes classifier in Julia that tells two Kaqchikel corpora apart: the Kaqchikel Chronicle (Kiwujil) and the modern Tang/Bennett written corpus.

Its features are character trigrams. Sliding a three-character window along one line of the Chronicle, “K’a ri’ xek’ule’”, gives 16 of them. The 11 that contain ’ each weigh 6 to 9 toward the Chronicle; the other 5 stay under 2.

Across the whole vocabulary, 45 of the 50 strongest Chronicle trigrams contain ’, and 40 of the 50 strongest Tang/Bennett trigrams contain '.

That was the first hint that the model was learning how each corpus was typed, not the language. The next posts follow that thread.
"""

[[post]]
slug = "confusion_morph"
scene = "ConfusionMorph"
title = "98.9% accurate. Too good?"
cover_at = 21.0
instagram = """
98.9% accurate. Too good to be true?

Every dot is one of 1,606 test sentences. The word model gets 91 wrong; character trigrams only 17.

Then write the glottal stop the same way in both corpora (’ becomes '): 90 wrong. Keep only characters both corpora use: 118 wrong, now worse than words.
"""
linkedin = """
My Kaqchikel classifier scored 98.9% on held-out text. That should have been a warning, not a result.

In this animation each of the 1,606 test sentences is a dot in its confusion-matrix cell:
• word unigrams: 94.3%, 91 wrong
• character trigrams: 98.9%, 17 wrong
• trigrams with ’ and ' folded into one character: 94.4%, 90 wrong (McNemar vs words: p = 1.0)
• trigrams on characters both corpora share: 92.7%, 118 wrong (p = 0.009, now below words)

Most of the trigram model's edge came from a single character. The next post shows which one.
"""

[[post]]
slug = "confound_reveal"
scene = "ConfoundReveal"
title = "Two apostrophes, one sound"
cover_at = 8.0
instagram = """
Two apostrophes, one sound.

Kaqchikel writes its glottal stop with an apostrophe. The Chronicle types ’ (U+2019) 15,982 times. Tang/Bennett types ' (U+0027) 269,074 times and ’ never, with no punctuation or digits at all.

A one-line rule with no training (“has a character Tang/Bennett never uses? say Chronicle”) scores 98.2%.
"""
linkedin = """
Two apostrophes, one sound, and a data leak.

Both Kaqchikel corpora write the glottal stop with an apostrophe, but not the same character:
• the Chronicle: ’ (U+2019) 15,982 times, ' (U+0027) 171 times
• Tang/Bennett: ' 269,074 times, ’ zero times, and no commas, digits, or other punctuation

22 characters appear in the Chronicle's training text and never in Tang/Bennett's. A rule with no training, “if a sentence has one of them, say Chronicle”, gets 98.2% of the test set right. That beats the word model (94.3%, McNemar p ≈ 9e-9) and nearly matches the trigram model (98.9%).

The labels come from where each text came from, so the encoding leaks the label. The fix was to normalize the orthography before trusting any score.
"""

