Three lessons from one apostrophe:

1. Try the dumbest baseline first. A rule with no training scored 98.2%.
2. Labels taken from where data came from leak where it came from. Clean every source the same way.
3. In Julia, never time the first call.

Without the spelling cues, the two sources are still about 93–94% separable, mostly by topic. And Kaqchikel is now in Julia's Languages.jl.

Thank you to Kevin Tang and Ryan Bennett for permission to share figures from their corpus.
"""
linkedin = """
Five weeks, one Naive Bayes classifier, and three lessons from Kaqchikel Maya.

1. Try the dumbest baseline first. A rule with no training scored 98.2%, within a point of my 98.9% model.
2. Labels taken from where data came from leak where it came from. Mine came from which corpus a sentence was in, so anything that differed between the corpora, even how an apostrophe was typed, became a feature. Clean every source the same way before comparing models.
3. In Julia, warm up before you time anything. My first reported speedup was compile time.

With the spelling cues removed, the two sources are still about 93–94% separable, mostly by topic: Biblical names on one side, Spanish surnames and colonial titles on the other. Whether any of that reflects how Kaqchikel changed over four centuries, this experiment can't say. Answering that needs many documents from each period, matched by genre.

One more output: Kaqchikel is now in Julia's Languages.jl. I added the language and its word lists, and the maintainer, Avik Sengupta, added the trigram profile after the detector first decided my Kaqchikel test sentence was Ilocano.

Thank you to Kevin Tang and Ryan Bennett for permission to share figures from their corpus. Code, paper, and the Languages.jl PRs are in the comments.
"""
linkedin_comment = """
Code, paper, and the data notes behind every number in this series: https://github.com/Chok-Ketzamtzib/18337-project-kaqchikel-NLP

Kaqchikel in Languages.jl: https://github.com/JuliaText/Languages.jl/pull/43 and https://github.com/JuliaText/Languages.jl/pull/46
