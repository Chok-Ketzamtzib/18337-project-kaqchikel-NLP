name: Convert Paper to PDF

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - wrap-up-kaqchikel-nb
    paths:
      - 'paper/**'
      - 'src/**'
      - '.github/workflows/md_to_pdf.yml'

jobs:
  converttopdf:
    name: Build PDF
    runs-on: ubuntu-latest
    steps:
      # Full history so the diagram staleness check can compare commit times.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checkout mtimes are all identical, so freshness is judged from the last
      # commit that touched each file rather than from the filesystem.
      - name: Warn if pipeline.png is stale relative to pipeline.dot
        run: |
          dot_at=$(git log -1 --format=%ct -- paper/images/pipeline.dot)
          png_at=$(git log -1 --format=%ct -- paper/images/pipeline.png)
          if [ -z "$dot_at" ] || [ -z "$png_at" ]; then
            echo "::warning::Could not determine commit times for pipeline.dot / pipeline.png."
          elif [ "$dot_at" -gt "$png_at" ]; then
            echo "::warning::paper/images/pipeline.png is older than pipeline.dot. Re-render with: dot -Tpng -Gdpi=170 paper/images/pipeline.dot -o paper/images/pipeline.png"
          else
            echo "pipeline.png is up to date with pipeline.dot."
          fi

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2

      - name: Instantiate Julia environment
        run: julia --project=src -e 'using Pkg; Pkg.instantiate()'

      # The Tang/Bennett corpus cannot be redistributed, so this resolves to the
      # surrogate corpus. Timings are reproducible; accuracy numbers are not
      # produced here. corpus_mode in the JSON records which substrate was used.
      - name: Regenerate thread scaling figure
        env:
          JULIA_NUM_THREADS: '4'
        run: julia --project=src src/benchmark.jl --quick

      - name: Install Pandoc and build PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-extra
          cd paper
          pandoc --citeproc --bibliography=paper.bib --variable classoption=twocolumn --variable papersize=a4paper -s paper.md -o paper.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            src/results/benchmark_results.json
            paper/images/thread_scaling.png
            paper/images/thread_scaling.svg
